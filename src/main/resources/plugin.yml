name: InstigateHardcore
version: 1.0.1
main: dev.instigatehardcore.InstigateHardcore
api-version: '26.3'

description: Shared-death hardcore survival for multiplayer Paper servers.
authors:
  - Sukesan
  - InstigateCafe

load: POSTWORLD

commands:
  hardcore:
    description: Instigate Cafe Hardcore commands.
    usage: /hardcore help
    aliases:
      - hc
    permission: instigatehardcore.command

  hcreplaytest:
    description: Preview a seven-second death replay.
    usage: /hcreplaytest <player> [pov]
    permission: instigatehardcore.debug

permissions:
  instigatehardcore.command:
    description: Access Instigate Cafe Hardcore commands.
    default: true

  instigatehardcore.admin:
    description: Access administrative Instigate Cafe Hardcore controls.
    default: op

  instigatehardcore.debug:
    description: Access Instigate Cafe Hardcore diagnostics.
    default: op

softdepend:
  - packetevents
