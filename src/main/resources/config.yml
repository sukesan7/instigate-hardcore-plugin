reset:
  countdown-seconds: 10

players:
  # Allow players who have not yet participated in the current
  # attempt to join while it is already in progress.
  #
  # true:
  #   New players may enter the ACTIVE attempt at any time.
  #
  # false:
  #   Only existing participants may rejoin once an attempt
  #   is underway. New players wait in the safety lobby until
  #   the next attempt.
  allow-late-joiners: true

scoreboard:
  enabled: true
  update-interval-ticks: 20

death-replay:
  enabled: true
  debug-preview-enabled: true
  duration-seconds: 7
  capture-interval-ticks: 2
  capture-radius-blocks: 24
  max-actors-per-frame: 48
  visuals:
    movement-particles: true
    max-particles-per-tick: 24

worlds:
  # Permanent safety/fallback world.
  # This should match the normal Paper level-name.
  lobby-world: world

  # Radius around active/standby Overworld spawn to generate ahead of time.
  #
  # 0 = 1 chunk
  # 1 = 3x3 chunks
  # 2 = 5x5 chunks
  preload-radius-chunks: 1

debug:
  enabled: false